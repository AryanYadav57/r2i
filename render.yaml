# Render.com blueprint for the API. Set secrets (INFERENCE_CLOUD_API_KEY, ...) in the dashboard.
services:
  - type: web
    name: r2i-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: R2I_CORS
        value: https://your-web-app.vercel.app
      - key: INFERENCE_CLOUD_API_KEY
        sync: false
      - key: INFERENCE_CLOUD_ENDPOINT
        value: https://aisuite.cirrascale.com/apis/v2
      - key: GOOGLE_MAPS_API_KEY
        sync: false
