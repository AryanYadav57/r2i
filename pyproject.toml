[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r2i"
version = "0.2.0"
description = "Route-to-Impact: congestion-aware eco-routing and fleet delivery planning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.3",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "osmnx>=1.9.0",
]

[project.optional-dependencies]
fleet = ["ortools>=9.10"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "requests>=2.31", "ortools>=9.10", "anthropic>=2.0", "scipy>=1.11"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E221", "E241", "E272", "I001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "E712", "F841"]
